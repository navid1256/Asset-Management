<!doctype html>
<html dir="rtl" lang="fa">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ورود پرسنل معاونت برنامه ریزی و فناوری</title>
  <link rel="stylesheet" href="../../assets/css/login.css" />
</head>

<body>
  <div class="wrapper">
    <img class="logo" src="../../assets/img/logo 1024.png" alt="Logo" />
    <h2>ورود</h2>
    <form method="post" id="loginForm">
      <!-- یوزر نیم -->
      <div class="input-box">
        <input type="text" name="username" placeholder="نام کاربری" value="" required />
      </div>
      <!-- پسورد -->
      <div class="input-box">
        <input type="password" name="password" placeholder="رمز عبور" required />
      </div>
      <!-- دکمه ورود -->
      <button type="submit" name="verify" class="btn">ورود</button>
    </form>
  </div>
</body>

</html>
