<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case Status</title>
    <link rel="stylesheet" href="../../assets/css/case-status.css">
    <link rel="icon" href="../../assets/img/logo.png" type="image">
</head>

<body>
    <header>
        <h1>نرم افزار مدیریت درخواست و ثبت تجهیزات فناوری</h1>
        <div class="user-profile">
            <img src="../../assets/img/profile-avatar.avif" alt="user profile" class="avatar">
            <div class="user-info">
                <p class="username">
                    <span>تحویل گیرنده :</span>
                    <span id="profile-full-name">نام تحویل گیرنده</span>
                </p>
                <p class="userrole" id="profile-department">معاونت / اداره</p>
            </div>
        </div>
        <div class="logged-in-user">
            <span>کاربر :</span>
            <span id="logged-in-username">کاربر نامشخص</span>
        </div>
        <img src="../../assets/img/logo.png" alt="لوگو شرکت">
    </header>

    <form action="#" method="post" class="case-form">
        <fieldset class="form-section">
            <legend>
                وضعیت کیس
            </legend>
            <section class="new-case">
                <h2>کیس جدید</h2>
                <div class="case-status">
                    <label for="case-status"> وضعیت کیس :</label>
                    <select id="case-status" name="caseStatus">
                        <option value="Select Status" disabled>Select Status</option>
                        <option value="0">در حال استفاده</option>
                        <option value="1" selected>استفاده نشده</option>
                    </select>
                </div>
            </section>
            <hr>
            <section class="old-case" id="old-case">
                <h2>کیس قدیمی</h2>
                <div class="case-status">
                    <label for="old-case-status"> وضعیت کیس :</label>
                    <select id="old-case-status" name="oldCaseStatus">
                        <option value="Select Status" disabled>Select Status</option>
                        <option value="0">در حال استفاده</option>
                        <option value="1" selected>از رده خارج شده</option>
                    </select>
                </div>
            </section>
        </fieldset>
    </form>

    <script src="../../assets/js/user-profile.js"></script>
    <script src="../../assets/js/case-status.js"></script>
</body>

</html>
